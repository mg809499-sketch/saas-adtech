# GrowUp Store API (NestJS) en Render free.
# Crear: Dashboard → New + → Blueprint → este repo. Warm-up: cron externo
# cada 10 min a GET /api/v1/billing/plans (el free duerme sin tráfico).
services:
  - type: web
    name: growup-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx tsc -p tsconfig.json
    startCommand: node dist/src/main.js
    healthCheckPath: /api/v1/billing/plans
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SYSTEM_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AES_SERVICE_KEY
        sync: false
      - key: BOLD_WEBHOOK_SECRET
        sync: false
      - key: MOCK_PAYMENTS
        value: "false"
      - key: STORE_DOMAIN
        value: growupstore.app
      - key: INTERNAL_EDGE_SECRET
        generateValue: true
      - key: PORT
        value: "3000"
