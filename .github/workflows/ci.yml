name: ci
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growupstore
        ports: ["5433:5432"]
        options: >- --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/growupstore
      JWT_SECRET: ci-jwt-secret-32-chars-minimo-x
      AES_SERVICE_KEY: ci-aes-32-bytes-key-1234567890ab
      BOLD_WEBHOOK_SECRET: whsec_ci
      MOCK_PAYMENTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx jest --config jest.config.js
        working-directory: apps/api
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps/web
      - run: ./node_modules/.bin/tsc --noEmit
        working-directory: apps/web
      - run: ./node_modules/.bin/next build
        working-directory: apps/web
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
